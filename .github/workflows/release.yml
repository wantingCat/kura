name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets so either matrix entry can cross-build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle portable mpv (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/resources/mpv"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $downloaded = $false
          $repos = @("zhongfly/mpv-winbuild", "shinchiro/mpv-winbuild-cmake")
          foreach ($repo in $repos) {
            try {
              Write-Host "Checking latest portable mpv release from $repo..."
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers @{
                Authorization = "Bearer $env:GH_TOKEN"
                "User-Agent"  = "Kura-Release-Builder"
              }
              $asset = $rel.assets | Where-Object {
                $_.name -match "^mpv-x86_64-20.*\.7z$" -and $_.name -notmatch "v3" -and $_.name -notmatch "dev"
              } | Select-Object -First 1
              if (-not $asset) {
                $asset = $rel.assets | Where-Object {
                  $_.name -match "^mpv-x86_64.*\.7z$" -and $_.name -notmatch "dev"
                } | Select-Object -First 1
              }
              if ($asset) {
                $archive = Join-Path $env:RUNNER_TEMP $asset.name
                Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)..."
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
                $extractDir = Join-Path $env:RUNNER_TEMP "mpv-extract"
                if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
                7z x $archive "-o$extractDir" -y | Out-Null
                $mpvExe = Get-ChildItem -Path $extractDir -Filter "mpv.exe" -Recurse | Select-Object -First 1
                if ($mpvExe) {
                  $srcFolder = $mpvExe.Directory.FullName
                  Copy-Item -Path "$srcFolder\*" -Destination $dest -Recurse -Force
                  Write-Host "Bundled mpv.exe from $($asset.name) into $dest"
                  $downloaded = $true
                  break
                }
              }
            } catch {
              Write-Warning "Failed to fetch mpv from ${repo}: $_"
            }
          }
          if (-not $downloaded) {
            throw "Could not download portable mpv.exe from any release mirror"
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kura ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download Kura for Windows, macOS, or Linux.'
          releaseDraft: false
          # Not marked as a pre-release even for alpha tags: the in-app updater reads
          # releases/latest, which GitHub never points at a pre-release.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
